<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>pico-hid</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #111;
        --bg: #fff;
        --pad: 630px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: var(--ink);
        display: flex;
        justify-content: center;
        padding: 18px 16px;
      }

      .container {
        width: 100%;
        max-width: var(--pad);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .row {
        display: flex;
      }

      #text-input {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid var(--ink);
        border-right: none;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        outline: none;
      }

      button {
        display: flex;
        align-items: center;
        justify-content: center;
        aspect-ratio: 1 / 1;
        padding: 0;
        border: 1px solid var(--ink);
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        font-size: 18px;
        cursor: pointer;
      }

      /* Marks which button is the live one; the two swap on mode change. */
      button.filled {
        background: var(--ink);
        color: var(--bg);
      }

      .row button + button {
        margin-left: -1px; /* collapse the doubled border between buttons */
      }

      button:hover {
        opacity: 0.85;
      }

      button:active {
        opacity: 0.7;
      }

      #trackpad {
        --chrome: 95px;
        width: 100%;
        height: var(--pad);
        max-height: calc(100vh - var(--chrome));
        max-height: calc(100dvh - var(--chrome)); /* iOS Safari: vh extends behind the URL bar */
        background: #f9f9f9;
        border: 1px solid var(--ink);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #trackpad.active {
        background: #e2e2e2;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="row">
        <input id="text-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button id="send-btn" type="button" class="filled" aria-label="Send">↵</button>
        <button id="kb-btn" type="button" aria-label="Keyboard mirror mode" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="2" y="6" width="20" height="12" />
            <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8" />
          </svg>
        </button>
      </div>

      <div id="trackpad"></div>
    </main>
    <script>
      // Every command goes through one queue, one request at a time. The board
      // serves a single connection at a time and isn't listening at all while
      // it holds a key down, so overlapping requests get refused — which showed
      // up as dropped characters when typing quickly.
      const SEND_GAP_MS = 70; // must exceed the board's per-key hold time
      const MAX_TRIES = 2;

      let inFlight = false;
      const queue = []; // discrete commands, delivered in order and never dropped
      let pendingDX = 0; // pointer movement, coalesced rather than queued
      let pendingDY = 0;

      // Resolves true/false instead of rejecting, so a failure can be retried
      // and can't surface as an unhandled rejection that stalls the pump.
      function sendCommand(body) {
        return fetch("/", { method: "POST", body }).then(
          () => true,
          () => false,
        );
      }

      function enqueue(body) {
        queue.push({ body, tries: 0, retry: true });
        pump();
      }

      function pump() {
        if (inFlight) return;

        let item = queue.shift();
        if (!item) {
          // Nothing queued: send accumulated movement instead. Movement is
          // coalesced because a stale delta is worth less than a fresh one, so
          // unlike a keystroke it's fine to merge or drop.
          const dx = Math.round(pendingDX);
          const dy = Math.round(pendingDY);
          if (dx === 0 && dy === 0) return;
          pendingDX -= dx;
          pendingDY -= dy;
          item = { body: `mouse=MOVE(${dx},${dy})`, tries: 0, retry: false };
        }

        inFlight = true;
        sendCommand(item.body).then((ok) => {
          item.tries++;
          if (!ok && item.retry && item.tries < MAX_TRIES) queue.unshift(item);
          // Gap before the next request so the board has finished the last one.
          setTimeout(() => {
            inFlight = false;
            pump();
          }, SEND_GAP_MS);
        });
      }

      const textInput = document.getElementById("text-input");
      const sendBtn = document.getElementById("send-btn");
      const kbBtn = document.getElementById("kb-btn");

      function sendText() {
        const text = textInput.value;
        if (!text) return;
        enqueue("typing=" + text);
        textInput.value = "";
        textInput.focus();
      }

      // The two buttons form a mode switch, so in mirror mode this returns to
      // input mode instead of sending — the field holds a key display, not text.
      sendBtn.addEventListener("click", () => {
        if (mirroring) setMirroring(false);
        else sendText();
      });
      textInput.addEventListener("keydown", (e) => {
        if (!mirroring && e.key === "Enter") sendText();
      });

      // --- Keyboard mirror mode ---
      // Physical-key names, keyed by KeyboardEvent.code. Using .code rather
      // than .key means we forward which key was pressed, not the character it
      // produced, so the target machine applies its own layout — that's what
      // makes shifted keys and shortcuts land correctly.
      const KEY_BY_CODE = {
        Space: "SPACE",
        Enter: "ENTER",
        NumpadEnter: "ENTER",
        Tab: "TAB",
        Backspace: "BACKSPACE",
        Delete: "DELETE",
        Escape: "ESCAPE",
        Insert: "INSERT",
        Home: "HOME",
        End: "END",
        PageUp: "PAGE_UP",
        PageDown: "PAGE_DOWN",
        CapsLock: "CAPS_LOCK",
        PrintScreen: "PRINT_SCREEN",
        ScrollLock: "SCROLL_LOCK",
        Pause: "PAUSE",
        ContextMenu: "APPLICATION",
        ArrowUp: "UP",
        ArrowDown: "DOWN",
        ArrowLeft: "LEFT",
        ArrowRight: "RIGHT",
        Minus: "MINUS",
        Equal: "EQUALS",
        BracketLeft: "LEFT_BRACKET",
        BracketRight: "RIGHT_BRACKET",
        Backslash: "BACKSLASH",
        Semicolon: "SEMICOLON",
        Quote: "QUOTE",
        Backquote: "GRAVE_ACCENT",
        Comma: "COMMA",
        Period: "PERIOD",
        Slash: "FORWARD_SLASH",
      };

      const MODIFIER_CODES = new Set([
        "ControlLeft",
        "ControlRight",
        "ShiftLeft",
        "ShiftRight",
        "AltLeft",
        "AltRight",
        "MetaLeft",
        "MetaRight",
      ]);

      // Display only — macOS-style symbols for the key readout. The chord sent
      // to the board still uses the plain names above.
      const MOD_SYMBOL = { CTRL: "^", ALT: "⌥", SHIFT: "⇧", GUI: "⌘" };
      const KEY_LABEL = {
        SPACE: "␣",
        ENTER: "⏎",
        TAB: "⇥",
        BACKSPACE: "⌫",
        DELETE: "⌦",
        ESCAPE: "⎋",
        INSERT: "Ins",
        HOME: "↖",
        END: "↘",
        PAGE_UP: "⇞",
        PAGE_DOWN: "⇟",
        CAPS_LOCK: "⇪",
        PRINT_SCREEN: "PrtSc",
        SCROLL_LOCK: "ScrLk",
        APPLICATION: "▤",
        UP: "↑",
        DOWN: "↓",
        LEFT: "←",
        RIGHT: "→",
        MINUS: "-",
        EQUALS: "=",
        LEFT_BRACKET: "[",
        RIGHT_BRACKET: "]",
        BACKSLASH: "\\",
        SEMICOLON: ";",
        QUOTE: "'",
        GRAVE_ACCENT: "`",
        COMMA: ",",
        PERIOD: ".",
        FORWARD_SLASH: "/",
      };

      let mirroring = false;

      // heldModifiers() already emits Control, Option, Shift, Command — the
      // order Apple writes them in — so a plain join matches the convention.
      function modSymbols(mods) {
        return mods.map((m) => MOD_SYMBOL[m]).join("");
      }

      function keyLabel(name) {
        return KEY_LABEL[name] || (name.length === 1 ? name.toUpperCase() : name);
      }

      function keyName(code) {
        if (/^Key[A-Z]$/.test(code)) return code.slice(3).toLowerCase();
        if (/^Digit[0-9]$/.test(code)) return code.slice(5);
        if (/^Numpad[0-9]$/.test(code)) return code.slice(6);
        if (/^F([1-9]|1[0-9]|2[0-4])$/.test(code)) return code;
        return KEY_BY_CODE[code] || null;
      }

      function heldModifiers(e) {
        const mods = [];
        if (e.ctrlKey) mods.push("CTRL");
        if (e.altKey) mods.push("ALT");
        if (e.shiftKey) mods.push("SHIFT");
        if (e.metaKey) mods.push("GUI");
        return mods;
      }

      function onMirrorKey(e) {
        // Swallow every key while mirroring, so shortcuts act on the target
        // machine instead of this browser. Note the OS keeps a few for itself
        // (Cmd+Tab, Alt+Tab) — those can't be forwarded.
        e.preventDefault();
        if (e.repeat) return; // don't flood the board with auto-repeat

        const mods = heldModifiers(e);
        if (MODIFIER_CODES.has(e.code)) {
          textInput.value = modSymbols(mods);
          return;
        }

        const name = keyName(e.code);
        if (!name) {
          textInput.value = e.code + " (unsupported)";
          return;
        }

        textInput.value = modSymbols(mods) + keyLabel(name);
        enqueue("keycode=" + mods.concat(name).join("+"));
      }

      function setMirroring(on) {
        mirroring = on;
        kbBtn.classList.toggle("filled", on);
        kbBtn.setAttribute("aria-pressed", String(on));
        sendBtn.classList.toggle("filled", !on);
        textInput.readOnly = on;
        textInput.value = "";
        if (on) {
          // Listen on window so keys are caught wherever focus sits, and drop
          // focus from the field so the caret doesn't imply it's editable.
          window.addEventListener("keydown", onMirrorKey);
          textInput.blur();
        } else {
          window.removeEventListener("keydown", onMirrorKey);
          textInput.focus(); // ready to type straight away
        }
      }

      kbBtn.addEventListener("click", () => setMirroring(!mirroring));

      const trackpad = document.getElementById("trackpad");
      trackpad.addEventListener("contextmenu", (e) => e.preventDefault());

      const CLICK_MOVE_THRESHOLD = 6; // total px below which a gesture is a click, not a drag
      const DOUBLE_CLICK_WINDOW_MS = 300;

      let dragging = false;
      let lastX = 0,
        lastY = 0;
      let totalDX = 0,
        totalDY = 0;
      let pendingClickTimer = null;

      trackpad.addEventListener("pointerdown", (e) => {
        trackpad.setPointerCapture(e.pointerId);
        trackpad.classList.add("active");
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        totalDX = 0;
        totalDY = 0;
        pendingDX = 0;
        pendingDY = 0;
      });

      trackpad.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        totalDX += dx;
        totalDY += dy;
        pendingDX += dx;
        pendingDY += dy;
        pump();
      });

      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        trackpad.classList.remove("active");
        pump();

        if (Math.hypot(totalDX, totalDY) > CLICK_MOVE_THRESHOLD) return;

        if (e.button === 2) {
          enqueue("mouse=RIGHT_CLICK(0,0)");
          return;
        }

        if (pendingClickTimer) {
          clearTimeout(pendingClickTimer);
          pendingClickTimer = null;
          enqueue("mouse=DOUBLE_CLICK(0,0)");
        } else {
          pendingClickTimer = setTimeout(() => {
            pendingClickTimer = null;
            enqueue("mouse=CLICK(0,0)");
          }, DOUBLE_CLICK_WINDOW_MS);
        }
      }

      trackpad.addEventListener("pointerup", endDrag);
      trackpad.addEventListener("pointercancel", endDrag);
    </script>
  </body>
</html>
