<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>pico-hid</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #111;
        --bg: #fff;
        --pad: 630px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: var(--ink);
        display: flex;
        justify-content: center;
        padding: 18px 16px;
      }

      .container {
        width: 100%;
        max-width: var(--pad);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .row {
        display: flex;
      }

      #text-input {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid var(--ink);
        border-right: none;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        outline: none;
      }

      button {
        display: flex;
        align-items: center;
        justify-content: center;
        aspect-ratio: 1 / 1;
        padding: 0;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--bg);
        font: inherit;
        font-size: 18px;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.85;
      }

      button:active {
        opacity: 0.7;
      }

      #trackpad {
        --chrome: 95px;
        width: 100%;
        height: var(--pad);
        max-height: calc(100vh - var(--chrome));
        max-height: calc(100dvh - var(--chrome)); /* iOS Safari: vh extends behind the URL bar */
        background: #f9f9f9;
        border: 1px solid var(--ink);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #trackpad.active {
        background: #e2e2e2;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="row">
        <input id="text-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button id="send-btn" type="button" aria-label="Send">↵</button>
      </div>

      <div id="trackpad"></div>
    </main>
    <script>
      // Fire-and-forget: failures are swallowed so an unhandled rejection
      // can't stall the drag pump below.
      function sendCommand(body) {
        return fetch("/", { method: "POST", body }).catch(() => {});
      }

      const textInput = document.getElementById("text-input");

      function sendText() {
        const text = textInput.value;
        if (!text) return;
        sendCommand("typing=" + text);
        textInput.value = "";
        textInput.focus();
      }

      document.getElementById("send-btn").addEventListener("click", sendText);
      textInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendText();
      });

      const trackpad = document.getElementById("trackpad");
      trackpad.addEventListener("contextmenu", (e) => e.preventDefault());

      const CLICK_MOVE_THRESHOLD = 6; // total px below which a gesture is a click, not a drag
      const DOUBLE_CLICK_WINDOW_MS = 300;

      let dragging = false;
      let lastX = 0,
        lastY = 0;
      let totalDX = 0,
        totalDY = 0;
      let pendingDX = 0,
        pendingDY = 0;
      let moveInFlight = false;
      let pendingClickTimer = null;

      // One MOVE request in flight at a time; movement arriving while it's
      // outstanding accumulates into the next one. The board handles
      // connections one at a time, so this paces itself to what the board can
      // keep up with instead of outrunning it and piling up failures.
      function flushMove() {
        if (moveInFlight) return;
        const dx = Math.round(pendingDX);
        const dy = Math.round(pendingDY);
        if (dx === 0 && dy === 0) return;
        pendingDX -= dx;
        pendingDY -= dy;
        moveInFlight = true;
        sendCommand(`mouse=MOVE(${dx},${dy})`).finally(() => {
          moveInFlight = false;
          flushMove(); // send whatever accumulated while this was in flight
        });
      }

      trackpad.addEventListener("pointerdown", (e) => {
        trackpad.setPointerCapture(e.pointerId);
        trackpad.classList.add("active");
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        totalDX = 0;
        totalDY = 0;
        pendingDX = 0;
        pendingDY = 0;
      });

      trackpad.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        totalDX += dx;
        totalDY += dy;
        pendingDX += dx;
        pendingDY += dy;
        flushMove();
      });

      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        trackpad.classList.remove("active");
        flushMove();

        if (Math.hypot(totalDX, totalDY) > CLICK_MOVE_THRESHOLD) return;

        if (e.button === 2) {
          sendCommand("mouse=RIGHT_CLICK(0,0)");
          return;
        }

        if (pendingClickTimer) {
          clearTimeout(pendingClickTimer);
          pendingClickTimer = null;
          sendCommand("mouse=DOUBLE_CLICK(0,0)");
        } else {
          pendingClickTimer = setTimeout(() => {
            pendingClickTimer = null;
            sendCommand("mouse=CLICK(0,0)");
          }, DOUBLE_CLICK_WINDOW_MS);
        }
      }

      trackpad.addEventListener("pointerup", endDrag);
      trackpad.addEventListener("pointercancel", endDrag);
    </script>
  </body>
</html>
